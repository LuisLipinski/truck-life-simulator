<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carregando ATS...</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111f;color:#e2e8f0;font-family:system-ui,sans-serif}p{opacity:.8}</style></head><body><p>Carregando carreiras...</p><script>(async()=>{try{const files=['parts/ats/00.txt','parts/ats/01.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<p>Não foi possível carregar a página de carreiras.</p>'}})();</script></body></html>
