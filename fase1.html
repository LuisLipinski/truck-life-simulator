<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carregando Fase 1...</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e2e8f0;font-family:system-ui,sans-serif}p{opacity:.8}</style></head><body><p>Carregando Fase 1...</p><script>(async()=>{try{const files=['parts/fase1/00.txt','parts/fase1/01.txt','parts/fase1/02.txt','parts/fase1/03.txt','parts/fase1/04.txt','parts/fase1/05.txt','parts/fase1/06.txt','parts/fase1/07.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<p>Não foi possível carregar a Fase 1.</p>'}})();</script></body></html>
